{% extends 'base.html' %}{% block content %}<div class="max-w-4xl mx-auto px-4 py-8"><h1 class="text-2xl font-black mb-6">مشترياتي من متجر الحسابات</h1><div class="space-y-3">{% for p in purchases %}<a href="{{url_for('my_digital_account',purchase_id=p.id)}}" class="nova-premium-card flex gap-4 items-center rounded-2xl p-4">{% if p.product.image_url %}<img src="{{p.product.image_url}}" class="w-20 h-20 rounded-xl object-cover">{% else %}<div class="w-20 h-20 rounded-xl bg-blue-500/10 flex items-center justify-center"><svg class="w-9 h-9 text-blue-300" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h10"/></svg></div>{% endif %}<div class="flex-1"><b>{{p.product.title}}</b><div class="text-xs text-gray-400 mt-1">تم الشراء · ${{p.price_paid|money}}</div><span class="text-blue-300 text-xs mt-2 inline-block">عرض بيانات الحساب</span></div></a>{% else %}<p class="text-gray-400 border border-slate-800 rounded-2xl p-8 text-center">لم تقم بشراء حسابات بعد.</p>{% endfor %}</div></div>{% endblock %}
