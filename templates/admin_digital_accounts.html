{% extends 'base.html' %}{% block content %}<div class="max-w-5xl mx-auto px-4 py-8"><h1 class="text-2xl font-black mb-6">إدارة متجر الحسابات</h1><form method="post" enctype="multipart/form-data" class="nova-premium-card rounded-3xl p-5 grid md:grid-cols-2 gap-3"><input name="title" required placeholder="عنوان الحساب" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="game" placeholder="اللعبة أو المنصة" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="account_email" required placeholder="البريد أو اسم تسجيل الدخول" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="account_password" required placeholder="كلمة مرور البريد الإلكتروني" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="account_username" placeholder="يوزر حساب إنستغرام (اختياري)" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="username_password" placeholder="كلمة مرور حساب إنستغرام (مع اليوزر)" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="account_id" placeholder="ID (اختياري)" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="price" type="number" min="0" step="0.01" required placeholder="السعر" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="image_file" type="file" accept="image/*" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><input name="image_url" placeholder="رابط الصورة (اختياري)" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><textarea name="description" placeholder="التفاصيل" class="rounded-xl bg-slate-950 border border-slate-700 p-3 md:col-span-2"></textarea><button class="rounded-xl bg-blue-600 p-3 font-black md:col-span-2">إضافة الحساب</button></form><div class="space-y-3 mt-7">{% for p in products %}<div class="flex flex-wrap items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900 p-4"><div class="flex-1"><b>{{p.title}}</b><div class="text-xs text-gray-400">{{p.game}} · ${{p.price|money}} · {{'متاح' if p.is_available else 'مباع/موقوف'}}</div></div><form method="post" action="{{url_for('toggle_digital_account',product_id=p.id)}}"><button class="border border-slate-700 rounded-lg px-3 py-2 text-xs">تغيير الحالة</button></form><form method="post" action="{{url_for('delete_digital_account',product_id=p.id)}}"><button class="border border-red-900 text-red-300 rounded-lg px-3 py-2 text-xs">حذف</button></form></div>{% else %}<p class="text-gray-400">لا توجد حسابات.</p>{% endfor %}</div></div>{% endblock %}
